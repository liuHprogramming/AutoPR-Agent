name: AutoPR-Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover tests

      - name: Check demo readiness
        run: python -m autopr_agent.status

      - name: Run deterministic evaluation
        run: python -m autopr_agent.evaluate

      - name: Evaluate offline patch judge
        run: python -m autopr_agent.judge_eval

      - name: Regenerate documentation artifacts
        run: |
          python -m autopr_agent.project_summary
          python -m autopr_agent.architecture_doc
          python -m autopr_agent.benchmark_catalog
          python -m autopr_agent.examples
          python -m autopr_agent.experiments_doc
